name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later. Current Node 24
      # bundles a compatible npm; pin to the version used by code-block-pro.
      - run: npm install -g npm@11.21.1
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
